spring:
  application:
    name: moil-backend-v1
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:moil}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

moil:
  jwt:
    secret: ${JWT_SECRET:moil-local-development-secret-key-must-be-at-least-32-bytes}
    access-token-expires-in: ${JWT_ACCESS_TOKEN_EXPIRES_IN:3600}
  smtp:
    enabled: ${SMTP_ENABLED:false}
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
  app-link:
    group-join-template: ${GROUP_JOIN_APP_LINK_TEMPLATE:moil://join/{groupId}}

server:
  port: 6500
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: INFO
